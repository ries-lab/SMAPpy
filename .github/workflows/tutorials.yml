# The tutorials and the help pages, rebuilt from the program and published
# on GitHub Pages.
#
# A tutorial is a storyboard that drives the real GUI (src/smappy/tutorial), so
# it is built here rather than kept as files: every push to main that touches
# the package re-runs it, and the pages always show the GUI as it is.  Each
# subtitle is read aloud by Kokoro, offline on the CPU, with its weights
# fetched from the Hugging Face hub and cached between runs.
#
# Needs Pages switched on once: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".  The site is then https://ries-lab.github.io/SMAPpy/
# and the help pages https://ries-lab.github.io/SMAPpy/help/
name: tutorials

on:
  push:
    branches: [main]
    paths:
      - "src/smappy/**"
      - ".github/workflows/tutorials.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and a newer push wins over one still running
concurrency:
  group: pages
  cancel-in-progress: true

env:
  VOICE: bf_emma

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's own libraries -- the GUI runs on the offscreen platform, so no
      # display is needed, but Qt still loads EGL -- and ffmpeg for the clips
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 ffmpeg

      # torch from its CPU index: the default wheel on Linux carries CUDA, 4 GB
      - name: Install smappy and Kokoro
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . kokoro colorama

      - name: Voice model (cached)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-${{ env.VOICE }}

      - name: Build the tutorials
        run: python -m smappy.tutorial -o site --voice "$VOICE"

      # the help pages beside them, the same the ? button opens in the program
      - name: Build the help pages
        run: python -m smappy.docs -o site/help --home ../

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
