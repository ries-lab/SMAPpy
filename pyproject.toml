[build-system]
# pybind11 is imported by setup.py, so it has to be here as well as in the
# environment: an isolated build (which is what `pip install .` does) sees only
# what this list names.
# setuptools 77 is the floor for PEP 639 (`license` as an SPDX string
# and `license-files`), which is how the licence is declared below.
requires = ["setuptools>=77", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `smappy-smlm` because `smappy` on PyPI is an unrelated
# package (a Smappee energy-monitor wrapper, last released in 2018).  The import
# name is unaffected: `pip install smappy-smlm`, then `import smappy`.
name = "smappy-smlm"
version = "0.1.1"
description = "Single-molecule localization fitting pipeline (Python port of the SMAP fast-simple workflow)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Jonas Ries", email = "ries@embl.de"}]
requires-python = ">=3.9"
keywords = ["SMLM", "super-resolution", "localization microscopy", "PALM", "STORM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
]
# Floors only, no caps: smappy has to install into an environment that already
# pins these (microclaw asks for numpy>=1.26, scipy>=1.12, tifffile>=2024.1.1),
# so anything tighter here would force a downgrade there.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "tifffile>=2022.5",
    "h5py>=3.6",
    "pyyaml>=5.4",      # camera configs: CameraMetadata.from_yaml
]

[project.urls]
Homepage = "https://github.com/ries-lab/SMAPpy"
Source = "https://github.com/ries-lab/SMAPpy"

[project.optional-dependencies]
viewer = ["matplotlib>=3.4"]   # RangeSlider
image = ["pillow>=9.0"]        # save_image, for a picture without a window
# Drift correction runs on a vendored copy of COMET (src/smappy/_comet); its
# cost function is compiled with the package, so this extra is only the plotting
# COMET's diagnostics use.
drift = ["matplotlib>=3.4"]
# COMET's GPU backend is written in numba-CUDA, so numba is needed only to use
# an NVIDIA GPU.  The CPU path is compiled either way and is what runs without
# this: 1:17 for a 46k-frame dataset, 5 s with --spline --group.
cuda = ["numba>=0.57"]

[project.scripts]
smappy-fit = "smappy.cli.fit:main"
smappy-live = "smappy.cli.live:main"
smappy-view = "smappy.cli.view:main"
smappy-drift = "smappy.cli.drift:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# COMET's licence has to travel with the copy of COMET, in the wheel as well as
# in the repository -- that is what the MIT licence asks for.
"smappy._comet" = ["LICENSE.txt"]

[tool.cibuildwheel]
# numpy is deliberately not a build dependency: the extensions include only
# pybind11/numpy.h, which carries its own ABI declarations and binds to numpy at
# run time, so one wheel serves numpy 1.x and 2.x alike.  The test command below
# is what proves that rather than assuming it.
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_*"
# Importing the modules proves only that they load.  ci/smoke.py fits a frame
# with a known emitter in it, so a wheel whose compiler produced subtly wrong
# code fails here rather than in a lab.
test-command = "python {project}/ci/smoke.py"
