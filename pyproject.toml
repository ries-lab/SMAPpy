[build-system]
# pybind11 is imported by setup.py, so it has to be here as well as in the
# environment: an isolated build (which is what `pip install .` does) sees only
# what this list names.
# setuptools 77 is the floor for PEP 639 (`license` as an SPDX string
# and `license-files`), which is how the licence is declared below.
requires = ["setuptools>=77", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `smappy-smlm` because `smappy` on PyPI is an unrelated
# package (a Smappee energy-monitor wrapper, last released in 2018).  The import
# name is unaffected: `pip install smappy-smlm`, then `import smappy`.
name = "smappy-smlm"
version = "0.4.1"
description = "Single-molecule localization fitting pipeline (Python port of the SMAP fast-simple workflow)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Jonas Ries", email = "ries@embl.de"}]
requires-python = ">=3.12"
keywords = ["SMLM", "super-resolution", "localization microscopy", "PALM", "STORM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
]
# Floors only, no caps: smappy has to install into an environment that already
# pins these (microclaw asks for numpy>=1.26, scipy>=1.12, tifffile>=2024.1.1),
# so anything tighter here would force a downgrade there.  Each floor is the
# lowest release the whole suite (--slow) passes with on Python 3.12, checked
# with `uv pip install --resolution lowest-direct`: the compiled ones at their
# first CPython 3.12 wheels, tifffile for imwrite's resolutionunit,
# PySide6 6.6.1 for QTimer.singleShot(ms, context, callable), pyqtgraph
# 0.13.3 for its LabelItem under PySide6 6.6.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11.2",
    "tifffile>=2022.7.28",
    "h5py>=3.10",
    "pyyaml>=6.0.1",    # camera configs: CameraMetadata.from_yaml
    # The GUI is how smappy is used, so it installs by default: `pip install
    # smappy-smlm` has to be the whole story, and an extra is opt-in by
    # definition -- there is no "on unless excluded" in the metadata, and uv
    # has no `default-extras` to lean on either.  The cost is ~400 MB on a
    # headless fitting box, which nothing there will import: `smappy.cli.gui`
    # imports Qt inside `main()`.
    #
    # PySide6-Essentials, not PySide6: the whole codebase imports QtCore,
    # QtGui and QtWidgets and nothing else, and pyqtgraph is happy with them.
    # The PySide6 meta-package additionally pulls PySide6-Addons (QtWebEngine,
    # Qt3D, Multimedia, ...), which measures 800 MB installed for nothing.
    # 6.9 and 6.10 crashed until two PySide bugs were worked around: the
    # collector deleting the QScreen (`gui/collector.keep_screens`) and an
    # exception from matplotlib's queued redraw left pending in processEvents
    # (`gui/canvas.py`).  Tested on 6.8.3, 6.9.3 and 6.10.3.
    "PySide6-Essentials>=6.6.1",
    "pyqtgraph>=0.13.3",
    "matplotlib>=3.7.3",  # the render LUTs, and the plugins' result plots
    # the plugins' pages set their maths with it: TeX's layout from an
    # OpenType maths font, pure Python (~3.5 MB with the font).  Optional in
    # practice -- without it `smappy.docs` falls back on matplotlib's mathtext
    "ziamath>=0.13",
    # Export Stack's MP4: H.264 through the ffmpeg binary it ships (a 29 MB
    # wheel).  A default, not an extra, for the same reason as the GUI: a
    # movie export that fails until something else is installed is not the
    # whole story.  ffmpeg runs as a separate program, so the licence of
    # its build does not reach smappy's.
    "imageio-ffmpeg>=0.4",
]

[project.urls]
Homepage = "https://github.com/ries-lab/SMAPpy"
Source = "https://github.com/ries-lab/SMAPpy"

[project.optional-dependencies]
# matplotlib is a base dependency now, so `drift` is satisfied by a plain
# install; it stays because the docs name it.
image = ["pillow>=10.0"]       # save_image, for a picture without a window
# Empty: imageio-ffmpeg is in `dependencies` above; kept so that
# `smappy-smlm[movie]`, written down while it was an extra, still installs.
movie = []
# Drift correction itself needs nothing: COMET is vendored and its cost function
# is compiled with the package.  This extra is only COMET's diagnostic plots,
# which are all behind flags.
drift = ["matplotlib>=3.7.3"]
# COMET's GPU backend is written in numba-CUDA, so numba is needed only to use
# an NVIDIA GPU.  The CPU path is compiled either way and is what runs without
# this: 1:17 for a 46k-frame dataset, 5 s at the grouped spline default.
cuda = ["numba>=0.59"]
# Empty: the GUI is in `dependencies` above.  `smappy-smlm[gui]` is kept
# working for anyone who wrote it down while it was an extra.
gui = []
# The GPU engine of the 3D viewer: wgpu-py (Metal / Vulkan / DX12, headless).
gpu = ["wgpu>=0.19"]
# `python -m smappy.tutorial TOPIC --video`: the tutorial page played by
# headless Chromium and encoded by ffmpeg (which is not a pip package).  The
# page itself needs nothing beyond the GUI.
# --voice: Piper, an offline neural voice; the voice model is a download of
# its own (see smappy.tutorial.voice).
tutorial = ["playwright>=1.40", "piper-tts>=1.2"]
# HDBSCAN in Find clusters (`plugins/clusters.py`): the hdbscan package, whose
# Boruvka spanning tree is 20x faster than scikit-learn's Prim's at 100 k
# localizations and scales where it does not.  DBSCAN and Voronoi need
# nothing beyond the base.
clusters = ["hdbscan>=0.8.44"]
# uipsf (src/uipsf), the PSF learning, runs on PyTorch: a 4 GB download on Linux with its CUDA
# libraries, 0.1 GB on a Mac or Windows.  So it is asked for, not installed by default, and the
# window that uses it says what to type (docs/uipsf/plan.md §7.4).
uipsf = ["torch>=2.4"]
# What the test suite needs beyond the package: `pip install -e .[test]`.
# pytest-xdist is for the whole suite before a PR: `pytest tests --slow -n auto`.
test = ["pytest>=8.4", "pytest-timeout>=2.1", "pytest-xdist>=3.2"]

[tool.pytest.ini_options]
# Every test has a limit, so a hung one fails with its name and a traceback
# instead of a suite that never ends -- a modal dialog nobody answers is the
# usual cause in a GUI test.  The slowest test takes about 130 s with eight
# running in parallel (`--durations`), so 300 s is not a limit a healthy
# test meets.  `timeout` is pytest-timeout's (`.[test]`); without it
# conftest.py declares the key so that it is not a warning, and only the
# faulthandler stays: at 240 s it prints every thread's stack, which shows
# where a hang inside Qt is, and lets the test go on.
timeout = 300
testpaths = ["tests"]
faulthandler_timeout = 240

[project.scripts]
smappy-fit = "smappy.cli.fit:main"
smappy-drift = "smappy.cli.drift:main"
smappy-gui = "smappy.cli.gui:main"
smappy-calibrate = "smappy.cli.calibrate:main"
smappy-batch = "smappy.cli.batch:main"
smappy-batch-gui = "smappy.gui.batch_window:main"
smappy-plugins = "smappy.user_plugins:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# COMET's licence has to travel with the copy of COMET, in the wheel as well as
# in the repository -- that is what the MIT licence asks for.
"smappy._comet" = ["LICENSE.txt"]
# uipsf's, likewise
"uipsf" = ["LICENSE"]
# the camera database: a file that is read at run time, so it has to be in the
# wheel and not only in the checkout
# and the simulator's built-in structures, likewise, and the window icon,
# and what the user's plugin folder is given (`smappy.user_plugins`)
"smappy" = ["data/*.json", "data/*.gui.yaml", "data/structures/*.yaml", "data/microscopes/*.yaml",
            "data/csv_conversions/*.yaml", "data/segment_presets/*.yaml",
            "data/icons/*.svg", "data/icons/*.png", "data/user_plugins/*.in"]
# the plugins' pages, read by the Help window (`smappy.docs`), one folder per
# level of the menu tree
"smappy.plugins" = ["*.chain.yaml", "docs/*.md", "docs/*/*.md", "docs/*/*/*.md", "docs/*/*/*/*.md"]
# and the pages of the tabs and windows that are not plugins
"smappy.docs" = ["panels/*.md"]

[tool.cibuildwheel]
# numpy is deliberately not a build dependency: the extensions include only
# pybind11/numpy.h, which carries its own ABI declarations and binds to numpy at
# run time, so one wheel serves numpy 1.x and 2.x alike.  The test command below
# is what proves that rather than assuming it.
build = "cp312-* cp313-* cp314-*"
skip = "pp* *-musllinux_*"
# Importing the modules proves only that they load.  ci/smoke.py fits a frame
# with a known emitter in it, so a wheel whose compiler produced subtly wrong
# code fails here rather than in a lab.
test-command = "python {project}/ci/smoke.py"

# PySide6 has no wheel for Python 3.14 on manylinux_2_28: 6.9 stops at 3.13 and
# 6.10 onwards needs glibc 2.34.  So the cp314 Linux wheel is built (and its
# test installs PySide6) on manylinux_2_34, which a 3.14 user on Linux needs
# for the GUI anyway; cp312 and cp313 stay on 2_28 for older systems.
[[tool.cibuildwheel.overrides]]
select = "cp314-manylinux_x86_64"
manylinux-x86_64-image = "manylinux_2_34"
