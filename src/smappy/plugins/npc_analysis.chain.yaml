# The labelling efficiency of nuclear pores, as the ROI manager does it by
# hand: group, find the pores, count every pore's corners and localizations,
# fit the efficiency to all of them.  Shipped as a chain rather than a plugin
# -- the steps are Segment regions' ring template and the two NPC plugins,
# each with its own settings.
schema: smappy-chain-v1
path: Analysis/Regions/Workflow/NPC Analysis
description: >-
  Finds the nuclear pores of the file, counts their corners and
  localizations, and fits the labelling efficiency, in one run.
grouping: layer
steps:
  - plugin: Analysis/Process/Layers
    label: layers
    version: "2"
    values:
      layers:
        - grouped: true            # the model wants one localization per blink
          start: keep              # the filter as the Render tab has it
          bounds: []
      remove: false
  - plugin: Analysis/Regions/Segment regions
    label: find the pores
    version: "1"
    values:                        # the NPC preset's values are the defaults
      preset: NPC
      method: ring
      replace: true
  - block: each pore                            # once in each pore found
    regions: rois
    steps:
      - plugin: Analysis/Measure/NPC Corners    # not renamed: replaces an earlier
        version: "2"                                # "NPC Corners", stands beside a renamed one
        values: {}
  - plugin: Analysis/Regions/Summarize/NPC labelling efficiency
    label: labelling efficiency
    version: "2"
    values: {}
