# The demo in two colours: the ring in colour 1, the lines and the scattered
# points in colour 2, with the split camera's ratios of the two-colour
# tutorials.
n_frames: 20000
key:
  n_frames: frames
  components.0.blinking.photons: photons per blink
  components.0.split_ratio: split ratio
  components.1.split_ratio: split ratio
components:
  - name: ring
    channel: 1
    split_ratio: 0.25
    structure: {kind: structure, preset: ring}
  - name: cross
    channel: 2
    split_ratio: 0.75
    structure: {kind: structure, preset: cross}
    photophysics_from: ring
