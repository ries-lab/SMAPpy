# The GUI a fresh install opens, and View > Workspace > Reset.  Save on it asks
# for a file of one's own (in the config folder): this one is never written.
# The same format View > Workspace > Save writes: to change it, arrange the
# tabs in the program, save the GUI, and put the tabs here.  A plugin named
# here that is not installed is left out when it is read.  `line_above: true`
# draws a line above a section (right-click it: *Line above*).  The tabs of
# one technique are not here but in data/workspaces, added by View >
# Workspace > Tabs, or a tab's right click.
version: 1
tabs:
- name: File
  instances:
  - plugin: File/Load/Load
  - plugin: File/Export/Localizations
  - plugin: File/Export/Stack
  - plugin: File/Simulate/Simulate
- name: Localize
  header: localize
  instances:
  - plugin: Localize/PSF calibration
  - plugin: Localize/Gaussian 2D
  - plugin: Localize/Gaussian 2D 2C
  - plugin: Localize/Spline 3D
  - plugin: Localize/Spline 3D 2C
  - plugin: Localize/DECODE
  - plugin: Analysis/After fit/Assign colours
    line_above: true
  - plugin: Analysis/Drift/RCC
  - plugin: Analysis/Drift/COMET
- name: Render
  kind: render
- name: Analysis
  header: analysis
  instances:
  - plugin: Analysis/Measure/Localization Statistics
  - plugin: Analysis/Measure/Localization Precision
  - plugin: Analysis/Measure/Histogram
  - plugin: Analysis/Measure/Time Course
  - plugin: Analysis/Measure/Line Profile
  - plugin: Analysis/Process/Remove Localizations
    line_above: true
  - plugin: Analysis/Process/Math Parser
  - plugin: Analysis/Process/Neighbourhood
  - plugin: Analysis/Measure/Spatial statistics
    line_above: true
- name: Regions
  header: roi
  instances:
  - plugin: Analysis/Regions/Segment regions
  - plugin: Analysis/Regions/Find clusters
  - plugin: Analysis/Regions/Filter ROIs
    line_above: true
  - plugin: Analysis/Regions/Sort ROIs
  - plugin: Analysis/Measure/Id statistics
    line_above: true
  - plugin: Analysis/Regions/Summarize/Export table
