# The tour's structure: a ring, two crossing lines and some scattered points
# over 10 x 10 um, in 3D.  The ring is dye 1 and the rest dye 2, which is what
# the two-colour simulation separates.
name: ring and cross, with scattered points
elements:
  - circle: 2500                     # slightly tilted: z within +-300 nm
    centre: [5000, 5000, 0]
    normal: [0, 0.12, 0.9928]
    density: 0.127                   # ~2000 labels
    dye: 1
  - line: [[1000, 1500, -200], [9000, 7500, 200]]
    density: 0.08
    width: 15                        # the lines are not razor thin
    dye: 2
  - line: [[1500, 8500, 150], [8500, 1500, 150]]
    density: 0.08
    width: 15
    dye: 2
  - polygon: [[500, 500], [9500, 500], [9500, 9500], [500, 9500]]
    density: 1.85e-6                 # ~150 labels
    z: [-300, 300]
    dye: 2
