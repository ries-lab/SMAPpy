# A resolution and density target, after ThunderSTORM's (Ovesny et al. 2014,
# supplementary figure 6): a star of 32 wedges around (5000, 5000), radius
# 4 um, alternately labelled and empty.  The gap between two labelled wedges is
# as wide as a wedge, 2 pi r / 32 = r / 5.1 at radius r -- 785 nm at the rim,
# 50 nm at r = 255 nm -- so how close to the centre the spokes stay apart is
# the resolution.  The 16 labelled wedges rise in density by sqrt(2) each,
# from 25 to 4525 labels per um^2, starting at the +x axis and turning towards
# +y, so the same picture shows where localizations begin to overlap.
name: resolution star (16 spokes, 25-4525 per um^2)
elements:
  - polygon: [[5000, 5000], [9000, 5000], [8995, 5196], [8981, 5392], [8957, 5587], [8923, 5780]]
    density: 2.5e-05    # 25 per um^2
  - polygon: [[5000, 5000], [8696, 6531], [8616, 6710], [8528, 6886], [8431, 7056], [8326, 7222]]
    density: 3.536e-05    # 35 per um^2
