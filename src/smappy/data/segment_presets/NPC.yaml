# Nuclear pore complexes: a ring of the pore's size -- eight corners at about
# 55 nm -- and, as keep, the checks that a candidate looks like a pore: enough
# localizations on the ring, a fitted radius near the pore's, and few
# localizations far from that ring for their precision (`plugins/npc.py`,
# `studies/npc_le` for why the values are these).  Where the table has
# sigma_nm, add "and psf_nm <= 150" for SMAP's in-focus check.  A preset is
# any of Segment regions' settings, by name; a lab adds its own structure as a
# file like this one under the config directory's segment_presets.
method: circle
circle:
  shape: ring
  min_radius_nm: 55.0
  max_radius_nm: 55.0
  ring_width_nm: 15.0
  precision_nm: 20.0
  bin_nm: 10.0
keep: n_ring >= 4 and 40 <= radius_nm <= 70 and far_p >= 0.05
