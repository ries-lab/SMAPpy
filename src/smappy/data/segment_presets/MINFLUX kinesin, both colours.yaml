# MINFLUX kinesin seen in both colours: as "MINFLUX kinesin", and only the
# molecules whose pair_id holds localizations of both (n_colours == 2) --
# the ones a two-colour step analysis needs.
method: ids
ids:
  column: pair_id
  min_size: 20
  membership: id
  draw: track
  angle: axis
  keep: n_locs >= 20 and displacement_nm >= 100 and linearity >= 0.8 and n_colours == 2
