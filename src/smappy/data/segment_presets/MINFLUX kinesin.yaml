# MINFLUX kinesin: every track with 20 localizations becomes an ROI -- of
# MINFLUX dual colour's pair_id (a molecule in one colour or both) where it
# was run, else of the traces, tid (attribute on auto), drawn as its
# track and turned along it; the ones that walk are used, the others added
# unused (keep rejected), to look at.  Walking is told from sticking and
# from diffusing to and fro along a microtubule, which is as elongated, by
# the position along the track rising steadily with time (linearity, r^2 of
# a straight line): in the two-colour kinesin data looked at (2026-11) the
# tracks that walked 100-270 nm had 0.8-0.98, at 200-600 nm/s.  In a table
# of two colours each ROI is annotated in the keyword list "colours" (both,
# or the one colour); "only in both colours" keeps those alone.
method: ids
ids:
  column: ""                # auto: pair_id, else tid
  min_size: 20
  membership: id
  draw: track
  angle: axis
  keep: displacement_nm >= 100 and linearity >= 0.8
keep_rejected: true
