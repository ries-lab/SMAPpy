# SMAPpy's own network fitter, version 1: DECODE's method as published, written new (smappy.netfit),
# trained on gpuvm for calibration B (the example package's ranges, as the port's decode_B).
name: netfit_v1
fitter: netfit
about: smappy.netfit version 1 -- DECODE as published, written new in SMAPpy's conventions
parts:
  backbone: {name: unet2, about: "a U-Net per frame, shared, then one over their features; 48 features, depth 2 + 2"}
  time_model: {name: frame_stack, about: "3 frames, the frame U-Net's features concatenated"}
  output: {name: offsets, about: "p, photons, x, y, z (offsets +-1 px), their sigmas, background"}
  extraction: {name: lookahead, about: "DECODE's: local maxima of p, p summed over the plus, threshold 0.5"}
  loss: {name: mixture, terms: [count, mixture, background]}
  schedule: {name: adamw_step, about: "AdamW 6e-4, x0.9 every 10 epochs, 10 000 fresh samples an epoch, early stop"}
models:
  B: netfit/v1_B/model.safetensors
fit: {threshold: 0.5}
keep: {min_prob: 0.5}
