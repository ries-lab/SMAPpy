# The 3 x 3 mixture peak, the uncertainty the mixture spread about it (extraction.py, SIGMAS): does the
# mixture over pixels hold the uncertainty that one pixel's sigma lacks (poc-plan, "claimed z precision")?
name: decode_port_sigmixture
base: decode_port_mixpeak
parts:
